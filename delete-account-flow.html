<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G2G — Delete Account Flow (All States)</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@200;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
<style>
/* ============================================================
   G2G Marketplace — Design tokens
   Source: quasar.variables.scss (Quasar v1 / Vue 2 app)
   ============================================================ */

/* Roboto Flex — loaded from Google Fonts (the production app uses
   the same family from Google Fonts). If you need it offline, drop
   the woff2 into fonts/ and swap the @font-face below. */
@import url('https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@200;400;500;600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined');

:root {
  /* -------- Brand -------- */
  --primary:         #ff4130;
  --primary-005:     #fff7f4;
  --red-1:           #fff1f0;
  --secondary:       #777777;
  --dark:            #303030;
  --text-label:      #9292a2;
  --dimmed-bg:       rgba(0, 0, 0, 0.7);

  /* -------- Semantic -------- */
  --positive:        #1dbf73;
  --negative:        #d32f2f;
  --info:            #448aff;
  --warning:         #ff8f00;

  /* -------- Neutrals (light) -------- */
  --font-default:    #303030;
  --font-2nd:        #777777;
  --font-disabled:   #a8a8ae;
  --stroke-button:   #d2d2da;
  --stroke-border:   #e9e9ee;
  --bg-disabled:     #f5f5f8;
  --bg-input-disabled:#f7f7f9;
  --bg-2:            #f7f7f9;
  --bg-1:            #fafafc;
  --surface:         #ffffff;

  /* -------- Type -------- */
  --font-family:     'Roboto Flex', system-ui, -apple-system, sans-serif;
  --font-mono:       ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Scale */
  --fs-h3: 1.875rem;   /* 30 */
  --lh-h3: 2rem;
  --fs-h4: 1.5rem;     /* 24 */
  --lh-h4: 2rem;
  --fs-h6: 1.25rem;    /* 20 */
  --lh-h6: 1.25rem;
  --fs-body1: 0.875rem;/* 14 */
  --lh-body1: 1rem;
  --fs-body2: 0.75rem; /* 12 */
  --lh-body2: 1rem;
  --fs-caption: 0.625rem; /* 10 */
  --lh-caption: 1rem;

  --fw-regular: 400;
  --fw-medium:  500;
  --fw-semi:    600;
  --fw-bold:    700;

  /* -------- Spacing (G2G step scale; not 4px/8px) -------- */
  --space-5:   5px;
  --space-10:  10px;
  --space-15:  15px;
  --space-20:  20px;
  --space-25:  25px;
  --space-30:  30px;
  --space-40:  40px;
  --space-50:  50px;
  --space-60:  60px;
  --space-70:  70px;
  --space-80:  80px;
  --space-100: 100px;

  /* Gutters */
  --gutter-tight:   12px;
  --gutter-relaxed: 30px;
  --gutter-large:   36px;

  /* -------- Radii -------- */
  --radius-btn:     5px;
  --radius-generic: 10px;   /* cards, modals, inputs */

  /* -------- Borders -------- */
  --border-default: 1px solid var(--stroke-button);
  --border-divider: 1px solid var(--stroke-border);

  /* -------- Shadows -------- */
  --shadow-card:
      0 0.14px 2.29266px rgba(0,0,0,0.03),
      0 0.37px 4.42626px rgba(0,0,0,0.05),
      0 3px 7px rgba(0,0,0,0.09);
  --shadow-card-hover: 0 5px 7px rgba(0,0,0,0.18);
  --shadow-up:         0 -3px 15px 0 rgba(115,115,123,0.25);

  /* -------- Control sizes -------- */
  --control-h: 48px;

  /* -------- Layout -------- */
  --content-max: 1200px;

  /* -------- Breakpoints (reference values) -------- */
  --bp-xs: 599px;
  --bp-sm: 1023px;
  --bp-md: 1439px;
  --bp-lg: 1919px;
}

/* Dark mode — applied by `body.body--dark` in the production app */
body.body--dark,
.body--dark,
[data-theme="dark"] {
  --font-default:    #ffffff;
  --font-2nd:        #a1a1a1;
  --font-disabled:   #565659;
  --stroke-button:   #4e4f53;
  --stroke-border:   #4e4f53;
  --bg-disabled:     #38383f;
  --bg-2:            #252529;
  --bg-1:            #212224;
  --surface:         #27282d;
  --dimmed-bg:       rgba(39, 40, 45, 0.8);
}

/* ============================================================
   Semantic type roles
   ============================================================ */
html, body {
  font-family: var(--font-family);
  font-size: 14px;
  line-height: 1.25rem;
  color: var(--font-default);
  background: var(--bg-1);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5, h6 { margin: 0; font-family: var(--font-family); color: var(--font-default); }

h3, .g-h3 {
  font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-semi);
}
h4, .g-h4 {
  font-size: var(--fs-h4); line-height: var(--lh-h4); font-weight: var(--fw-semi);
}
h6, .g-h6 {
  font-size: var(--fs-h6); line-height: var(--lh-h6); font-weight: var(--fw-semi);
}

.g-body1, .body1 {
  font-size: var(--fs-body1); line-height: var(--lh-body1); font-weight: var(--fw-medium);
}
.g-body2, .body2 {
  font-size: var(--fs-body2); line-height: var(--lh-body2); font-weight: var(--fw-regular);
}
.g-caption, .caption {
  font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-regular);
  color: var(--font-2nd);
}

.g-label {
  font-size: var(--fs-body2);
  color: var(--text-label);
  font-weight: var(--fw-medium);
}

.g-muted   { color: var(--font-2nd); }
.g-label-c { color: var(--text-label); }

/* Color utility helpers mirroring Quasar's text-* / bg-* pattern */
.text-primary  { color: var(--primary); }
.text-positive { color: var(--positive); }
.text-negative { color: var(--negative); }
.text-warning  { color: var(--warning); }
.text-info     { color: var(--info); }

.bg-primary    { background: var(--primary); color: #fff; }
.bg-primary-tint{ background: var(--primary-005); color: var(--primary); }
.bg-positive   { background: var(--positive); color: #fff; }
.bg-negative   { background: var(--negative); color: #fff; }
.bg-warning    { background: var(--warning); color: #fff; }
.bg-info       { background: var(--info); color: #fff; }

* { box-sizing: border-box; }
body { margin:0; background:#ececf0; font-family:var(--font-family); }
@keyframes g2g-spin    { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes g2g-fade-up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@keyframes g2g-pulse   { 0%,100%{opacity:1} 50%{opacity:.55} }
.g2g-anim { animation:g2g-fade-up .2s ease-out; }

/* ── Tab bar ── */
#tab-bar {
  position: sticky; top: 0; z-index: 100;
  background: #1b1c1f;
  display: flex; align-items: stretch;
  border-bottom: 2px solid #ff4130;
  overflow-x: auto;
}
#tab-bar button {
  flex: 0 0 auto;
  padding: 0 28px; height: 52px;
  background: transparent; border: none;
  color: #a0a0a8; font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
  white-space: nowrap; transition: color .15s, border-color .15s;
  display: flex; align-items: center; gap: 8px;
}
#tab-bar button .tab-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
#tab-bar button:hover { color: #fff; }
#tab-bar button.active {
  color: #fff; font-weight: 600;
  border-bottom: 3px solid #ff4130;
}
#tab-bar .bar-title {
  padding: 0 20px; color: #4e4f53; font-size: 12px; font-weight: 600;
  letter-spacing: .04em; display: flex; align-items: center;
  border-right: 1px solid #2e2f33;
}

/* ── Panel ── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Simulated browser chrome ── */
.browser-wrap {
  margin: 20px auto; max-width: 1320px; padding: 0 20px;
}
.browser-chrome {
  background: #2e2f33; border-radius: 12px 12px 0 0;
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
}
.browser-chrome .dots { display:flex; gap:6px; }
.browser-chrome .dot { width:12px; height:12px; border-radius:50%; }
.browser-chrome .url-bar {
  flex: 1; height: 28px; background: #1b1c1f; border-radius: 6px;
  display: flex; align-items: center; padding: 0 12px;
  font-size: 11px; color: #6e6f73; font-family: var(--font-mono, monospace);
  gap: 6px;
}
.browser-chrome .url-bar .lock { color: #1dbf73; font-size: 13px; }
.sim-screen {
  background: #fafafc;
  border: 1px solid #2e2f33; border-top: none;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
  min-height: 600px;
}

/* ── State label pill ── */
.state-label {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 700;
  letter-spacing: .04em; margin: 0 20px 4px;
}
</style>
</head>

  <div class="bar-title">G2G · Delete Account</div>

    <span class="tab-dot" style="background:#ff4130"></span>

</div>

<div id="root-0" class="tab-panel active"><div class="browser-wrap"><div class="browser-chrome"><div class="dots"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div></div><div class="url-bar"><span class="lock material-icons" style="font-size:13px">lock</span>g2g.com/account/privacy-security</div></div><div class="sim-screen" id="app-0"></div></div></div>
<div id="root-1" class="tab-panel"><div class="browser-wrap"><div class="browser-chrome"><div class="dots"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div></div><div class="url-bar"><span class="lock material-icons" style="font-size:13px">lock</span>g2g.com/account/privacy-security</div></div><div class="sim-screen" id="app-1"></div></div></div>
<div id="root-2" class="tab-panel"><div class="browser-wrap"><div class="browser-chrome"><div class="dots"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div></div><div class="url-bar"><span class="lock material-icons" style="font-size:13px">lock</span>g2g.com/account/privacy-security</div></div><div class="sim-screen" id="app-2"></div></div></div>
<div id="root-3" class="tab-panel"><div class="browser-wrap"><div class="browser-chrome"><div class="dots"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div></div><div class="url-bar"><span class="lock material-icons" style="font-size:13px">lock</span>g2g.com/account/privacy-security</div></div><div class="sim-screen" id="app-3"></div></div></div>

<script>
function switchTab(n) {
  document.querySelectorAll('#tab-bar button').forEach((b,i) => b.classList.toggle('active', i===n));
  document.querySelectorAll('.tab-panel').forEach((p,i) => p.classList.toggle('active', i===n));
}
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
// ===== Primitives =====
// ============ primitives ============
window.Button = function Button({ variant='primary', size='md', leading, trailing, children, ...rest }) {
  const base = {
    height: size === 'sm' ? 36 : 48,
    padding: size === 'sm' ? '0 14px' : '0 20px',
    borderRadius: 5, fontWeight: 600, fontSize: size==='sm'?12:14,
    cursor: rest.disabled ? 'not-allowed' : 'pointer',
    border: 'none', fontFamily: 'inherit',
    display: 'inline-flex', alignItems: 'center', gap: 8, justifyContent: 'center',
    transition: 'background .15s ease, box-shadow .15s ease',
  };
  const variants = {
    primary:  { background: rest.disabled?'#f5f5f8':'#ff4130', color: rest.disabled?'#a8a8ae':'#fff' },
    outlined: { background:'transparent', border:'1px solid #d2d2da', color:'#303030' },
    ghost:    { background:'transparent', color:'#303030' },
    dark:     { background:'#303030', color:'#fff' },
  };
  return <button {...rest} style={{ ...base, ...variants[variant], ...(rest.style||{}) }}>
    {leading && <span className="material-icons" style={{fontSize:18}}>{leading}</span>}
    {children}
    {trailing && <span className="material-icons" style={{fontSize:18}}>{trailing}</span>}
  </button>;
};

window.Input = function Input({ label, leading, ...rest }) {
  return <label style={{display:'block'}}>
    {label && <div style={{fontSize:12, color:'#9292a2', fontWeight:500, marginBottom:6}}>{label}</div>}
    <div style={{height:48, border:'1px solid #d2d2da', borderRadius:10, display:'flex', alignItems:'center', padding:'0 12px', gap:8, background:'#fff'}}>
      {leading && <span className="material-icons-outlined" style={{fontSize:20, color:'#9292a2'}}>{leading}</span>}
      <input {...rest} style={{border:'none', outline:'none', flex:1, fontFamily:'inherit', fontSize:14, color:'#303030', background:'transparent'}} />
    </div>
  </label>;
};

window.Chip = function Chip({ tone='neutral', children, style }) {
  const tones = {
    hot:      { bg:'#fff1f0', fg:'#d32f2f' },
    new:      { bg:'#fff7f4', fg:'#ff4130' },
    verified: { bg:'#e8f8f0', fg:'#1dbf73' },
    info:     { bg:'#e8f0ff', fg:'#448aff' },
    warn:     { bg:'#fff4e0', fg:'#ff8f00' },
    danger:   { bg:'#fff1f0', fg:'#d32f2f' },
    neutral:  { bg:'#f5f5f8', fg:'#303030' },
  };
  const t = tones[tone] || tones.neutral;
  return <span style={{display:'inline-flex',alignItems:'center',padding:'3px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:'.03em',background:t.bg,color:t.fg, ...(style||{})}}>{children}</span>;
};

window.Pill = function Pill({ active, children, onClick }) {
  return <button onClick={onClick} style={{
    height:32, padding:'0 14px', borderRadius:9999, cursor:'pointer', fontFamily:'inherit',
    fontSize:12, fontWeight:500,
    border: active?'1px solid #ff4130':'1px solid #d2d2da',
    background: active?'#ff4130':'#fff',
    color: active?'#fff':'#303030',
  }}>{children}</button>;
};

window.Card = function Card({ children, hoverable=true, style, onClick }) {
  const [h, setH] = React.useState(false);
  return <div
    onClick={onClick}
    onMouseEnter={()=>hoverable&&setH(true)}
    onMouseLeave={()=>setH(false)}
    style={{
      background:'#fff', borderRadius:10,
      boxShadow: h
        ? '0 5px 7px rgba(0,0,0,0.18)'
        : '0 0.14px 2.29266px rgba(0,0,0,0.03), 0 0.37px 4.42626px rgba(0,0,0,0.05), 0 3px 7px rgba(0,0,0,0.09)',
      cursor: onClick ? 'pointer' : 'default',
      transition: 'box-shadow .2s ease',
      ...(style||{})
    }}
  >{children}</div>;
};

// ===== Chrome =====
window.Header = function Header({ cartCount=0, onNav, current='home' }) {
  return (
    <div style={{background:'#fff', borderBottom:'1px solid #e9e9ee', position:'sticky', top:0, zIndex:10}}>
      <div style={{maxWidth:1200, margin:'0 auto', padding:'0 20px', height:64, display:'flex', alignItems:'center', gap:24}}>
        <div onClick={()=>onNav('home')} style={{cursor:'pointer', display:'inline-flex', alignItems:'baseline', fontWeight:900, fontSize:28, letterSpacing:'-.02em', lineHeight:1}}>
          <span style={{color:'#303030'}}>G</span>
          <span style={{color:'#ff4130', fontSize:20, transform:'translateY(-2px)', margin:'0 1px'}}>2</span>
          <span style={{color:'#303030'}}>G</span>
        </div>
        <nav style={{display:'flex', gap:4, height:64, alignItems:'stretch'}}>
          {['Marketplace','Sell','Coaching','Gift Cards'].map(l=>{
            const active = (l==='Marketplace' && (current==='home'||current==='category'||current==='product'));
            return <a key={l} onClick={()=>l==='Marketplace'&&onNav('home')} style={{
              display:'inline-flex', alignItems:'center', padding:'0 14px', fontSize:14, fontWeight:500,
              color: active?'#ff4130':'#303030',
              borderBottom: active?'2px solid #ff4130':'2px solid transparent',
              cursor:'pointer'
            }}>{l}</a>;
          })}
        </nav>
        <div style={{flex:1, maxWidth:420, height:40, border:'1px solid #d2d2da', borderRadius:10, display:'flex', alignItems:'center', padding:'0 12px', gap:8}}>
          <span className="material-icons-outlined" style={{fontSize:18, color:'#9292a2'}}>search</span>
          <input placeholder="Search games, items, sellers" style={{border:'none', outline:'none', flex:1, fontSize:13, fontFamily:'inherit', background:'transparent'}}/>
        </div>
        <div style={{display:'flex', gap:14, alignItems:'center'}}>
          <span className="material-icons-outlined" style={{fontSize:22, color:'#303030', cursor:'pointer'}}>language</span>
          <span className="material-icons-outlined" style={{fontSize:22, color:'#303030', cursor:'pointer'}}>notifications</span>
          <div style={{position:'relative', cursor:'pointer'}} onClick={()=>onNav('cart')}>
            <span className="material-icons-outlined" style={{fontSize:22, color:'#303030'}}>shopping_cart</span>
            {cartCount>0 && <span style={{position:'absolute', top:-6, right:-8, background:'#ff4130', color:'#fff', borderRadius:9999, minWidth:16, height:16, fontSize:10, fontWeight:700, display:'inline-flex', alignItems:'center', justifyContent:'center', padding:'0 4px'}}>{cartCount}</span>}
          </div>
          <Button size="sm" variant="primary" onClick={()=>onNav('signin')}>Sign in</Button>
        </div>
      </div>
    </div>
  );
};

window.Footer = function Footer() {
  const cols = [
    {h:'Marketplace', items:['Game Coins','Game Accounts','In-Game Items','Game Coaching','Gift Cards']},
    {h:'Sell on G2G', items:['Become a Seller','Seller Program','Affiliate Program','Bulk Sellers']},
    {h:'Support', items:['Help Center','GamerProtect','Contact Us','Dispute Resolution']},
    {h:'Company', items:['About','Careers','Blog','Press']},
  ];
  return (
    <footer style={{background:'#303030', color:'#fff', padding:'40px 20px 20px', marginTop:60}}>
      <div style={{maxWidth:1200, margin:'0 auto'}}>
        <div style={{display:'grid', gridTemplateColumns:'1.2fr 1fr 1fr 1fr 1fr', gap:30, marginBottom:30}}>
          <div>
            <div style={{display:'inline-flex', alignItems:'baseline', fontWeight:900, fontSize:28, letterSpacing:'-.02em', lineHeight:1, marginBottom:12}}>
              <span>G</span><span style={{color:'#ff4130', fontSize:20, transform:'translateY(-2px)', margin:'0 1px'}}>2</span><span>G</span>
            </div>
            <div style={{fontSize:12, color:'#a1a1a1', lineHeight:1.6, maxWidth:240}}>
              The world-leading digital marketplace for gamers. Designed by gamers, for gamers.
            </div>
          </div>
          {cols.map(c=>(
            <div key={c.h}>
              <div style={{fontSize:13, fontWeight:600, marginBottom:10}}>{c.h}</div>
              {c.items.map(i=><div key={i} style={{fontSize:12, color:'#a1a1a1', padding:'4px 0', cursor:'pointer'}}>{i}</div>)}
            </div>
          ))}
        </div>
        <div style={{borderTop:'1px solid #4e4f53', paddingTop:16, display:'flex', justifyContent:'space-between', fontSize:11, color:'#a1a1a1'}}>
          <div>© 2026 Gamer2Gamer Global Pte Ltd. All rights reserved.</div>
          <div style={{display:'flex', gap:16}}>
            <span>Terms</span><span>Privacy</span><span>Cookies</span>
          </div>
        </div>
      </div>
    </footer>
  );
};

// G2G — Delete Account flow screens

// ---------- Shared mini components ----------

window.SidebarNav = function SidebarNav({ active='delete', onNav }) {
  const groups = [
    { h: 'Account', items: [
      { id:'profile',   label:'Profile',           icon:'person_outline' },
      { id:'security',  label:'Login & security',  icon:'lock_outline' },
      { id:'payment',   label:'Payment methods',   icon:'credit_card' },
      { id:'address',   label:'Addresses',         icon:'place' },
    ]},
    { h: 'Activity', items: [
      { id:'orders',    label:'My orders',         icon:'receipt_long' },
      { id:'disputes',  label:'Disputes',          icon:'gavel' },
      { id:'wallet',    label:'Wallet & WSC',      icon:'account_balance_wallet' },
    ]},
    { h: 'Preferences', items: [
      { id:'notif',     label:'Notifications',     icon:'notifications_none' },
      { id:'language',  label:'Language & region', icon:'language' },
      { id:'delete',    label:'Delete account',    icon:'no_accounts', danger:true },
    ]},
  ];
  return (
    <aside style={{width:240, flexShrink:0}}>
      {groups.map(g => (
        <div key={g.h} style={{marginBottom:24}}>
          <div style={{fontSize:11, fontWeight:600, letterSpacing:'.06em', color:'#9292a2', textTransform:'uppercase', padding:'0 12px 8px'}}>{g.h}</div>
          {g.items.map(it => {

      ],
    },
    'sc-balance': {
      icon: 'savings',
      title: 'Remaining wallet balance',
      summary: 'Withdraw your funds or write off the balance to proceed.',
      severity: 'medium',
      isBalance: true,
      balances: [
        { type:'Withdrawable Balance', amount:'$284.20', meta:'Eligible for bank withdrawal', action:'Withdraw' },
        { type:'Store Credit (SC)', amount:'120.00 SC', meta:'Non-withdrawable — spend or write off before deletion', action:'Spend' },
      ],
    },
    'risk-anomaly': {
      icon: 'shield',
      title: 'Additional review needed',
      summary: "We’ve detected unusual activity. Our risk team needs to review before deletion can proceed.",
      severity: 'high',
      items: [
        { id:'Risk Ticket #RT-9911', label:'Pending risk-team review', meta:'Auto-generated · usually resolved within 48h', status:'Under review', tone:'danger', cta:'Contact support', ctaLink:'/support' },
      ],
    },
  };

  allBlockers['wsc-balance'] = allBlockers['sc-balance'];

  const active = blockerSet.length > 0 ? blockerSet : ['active-order','sc-balance'];
  const blockers = active.map(k => ({ key:k, ...allBlockers[k] })).filter(b => b.icon);
  const remaining = blockers.filter(b => !resolved.has(b.key));

  const handleWriteOff = (key) => {
    const next = new Set(resolved);
    next.add(key);
    setResolved(next);
    const stillBlocked = blockers.filter(b => !next.has(b.key));
    if (stillBlocked.length === 0 && onEnterCoolingOff) {
      setTimeout(() => onEnterCoolingOff(), 300);
    }
  };

  return (

          <div style={{fontSize:12, color:'#5c1612', marginTop:4}}>

            onWriteOff={b.isBalance ? () => handleWriteOff(b.key) : null}
          />
        ))}
      </div>

      <div style={{display:'flex', justifyContent:'space-between', gap:10}}>
        <Button variant="outlined" onClick={onCancelRequest} leading="close">Dismiss</Button>
        <Button variant="primary" onClick={onRetry} leading="refresh">Submit a new request</Button>
      </div>

  );

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

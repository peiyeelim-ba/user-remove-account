document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

off2');\n}\n/* fallback */\n@font-face {\n  font-family: 'Material Icons Outlined';\n  font-style: normal;\n  font-weight: 400;\n  src: url(\"7726aac8-6f87-4c23-88ca-0152dae5680b\") format('woff2');\n}\n\n.material-icons {\n  font-family: 'Material Icons';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n\n.material-icons-outlined {\n  font-family: 'Material Icons Outlined';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n\n\n:root {\n  /* -------- Brand -------- */\n  --primary:         #ff4130;\n  --primary-005:     #fff7f4;\n  --red-1:           #fff1f0;\n  --secondary:       #777777;\n  --dark:            #303030;\n  --text-label:      #9292a2;\n  --dimmed-bg:       rgba(0, 0, 0, 0.7);\n\n  /* -------- Semantic -------- */\n  --positive:        #1dbf73;\n  --negative:        #d32f2f;\n  --info:            #448aff;\n  --warning:         #ff8f00;\n\n  /* -------- Neutrals (light) -------- */\n  --font-default:    #303030;\n  --font-2nd:        #777777;\n  --font-disabled:   #a8a8ae;\n  --stroke-button:   #d2d2da;\n  --stroke-border:   #e9e9ee;\n  --bg-disabled:     #f5f5f8;\n  --bg-input-disabled:#f7f7f9;\n  --bg-2:            #f7f7f9;\n  --bg-1:            #fafafc;\n  --surface:         #ffffff;\n\n  /* -------- Type -------- */\n  --font-family:     'Roboto Flex', system-ui, -apple-system, sans-serif;\n  --font-mono:       ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* Scale */\n  --fs-h3: 1.875rem;   /* 30 */\n  --lh-h3: 2rem;\n  --fs-h4: 1.5rem;     /* 24 */\n  --lh-h4: 2rem;\n  --fs-h6: 1.25rem;    /* 20 */\n  --lh-h6: 1.25rem;\n  --fs-body1: 0.875rem;/* 14 */\n  --lh-body1: 1rem;\n  --fs-body2: 0.75rem; /* 12 */\n  --lh-body2: 1rem;\n  --fs-caption: 0.625rem; /* 10 */\n  --lh-caption: 1rem;\n\n  --fw-regular: 400;\n  --fw-medium:  500;\n  --fw-semi:    600;\n  --fw-bold:    700;\n\n  /* -------- Spacing (G2G step scale; not 4px/8px) -------- */\n  --space-5:   5px;\n  --space-10:  10px;\n  --space-15:  15px;\n  --space-20:  20px;\n  --space-25:  25px;\n  --space-30:  30px;\n  --space-40:  40px;\n  --space-50:  50px;\n  --space-60:  60px;\n  --space-70:  70px;\n  --space-80:  80px;\n  --space-100: 100px;\n\n  /* Gutters */\n  --gutter-tight:   12px;\n  --gutter-relaxed: 30px;\n  --gutter-large:   36px;\n\n  /* -------- Radii -------- */\n  --radius-btn:     5px;\n  --radius-generic: 10px;   /* cards, modals, inputs */\n\n  /* -------- Borders -------- */\n  --border-default: 1px solid var(--stroke-button);\n  --border-divider: 1px solid var(--stroke-border);\n\n  /* -------- Shadows -------- */\n  --shadow-card:\n      0 0.14px 2.29266px rgba(0,0,0,0.03),\n      0 0.37px 4.42626px rgba(0,0,0,0.05),\n      0 3px 7px rgba(0,0,0,0.09);\n  --shadow-card-hover: 0 5px 7px rgba(0,0,0,0.18);\n  --shadow-up:         0 -3px 15px 0 rgba(115,115,123,0.25);\n\n  /* -------- Control sizes -------- */\n  --control-h: 48px;\n\n  /* -------- Layout -------- */\n  --content-max: 1200px;\n\n  /* -------- Breakpoints (reference values) -------- */\n  --bp-xs: 599px;\n  --bp-sm: 1023px;\n  --bp-md: 1439px;\n  --bp-lg: 1919px;\n}\n\n/* Dark mode — applied by `body.body--dark` in the production app */\nbody.body--dark,\n.body--dark,\n[data-theme=\"dark\"] {\n  --font-default:    #ffffff;\n  --font-2nd:        #a1a1a1;\n  --font-disabled:   #565659;\n  --stroke-button:   #4e4f53;\n  --stroke-border:   #4e4f53;\n  --bg-disabled:     #38383f;\n  --bg-2:            #252529;\n  --bg-1:            #212224;\n  --surface:         #27282d;\n  --dimmed-bg:       rgba(39, 40, 45, 0.8);\n}\n\n/* ============================================================\n   Semantic type roles\n   ============================================================ */\nhtml, body {\n  font-family: var(--font-family);\n  font-size: 14px;\n  line-height: 1.25rem;\n  color: var(--font-default);\n  background: var(--bg-1);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6 { margin: 0; font-family: var(--font-family); color: var(--font-default); }\n\nh3, .g-h3 {\n  font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-semi);\n}\nh4, .g-h4 {\n  font-size: var(--fs-h4); line-height: var(--lh-h4); font-weight: var(--fw-semi);\n}\nh6, .g-h6 {\n  font-size: var(--fs-h6); line-height: var(--lh-h6); font-weight: var(--fw-semi);\n}\n\n.g-body1, .body1 {\n  font-size: var(--fs-body1); line-height: var(--lh-body1); font-weight: var(--fw-medium);\n}\n.g-body2, .body2 {\n  font-size: var(--fs-body2); line-height: var(--lh-body2); font-weight: var(--fw-regular);\n}\n.g-caption, .caption {\n  font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-regular);\n  color: var(--font-2nd);\n}\n\n.g-label {\n  font-size: var(--fs-body2);\n  color: var(--text-label);\n  font-weight: var(--fw-medium);\n}\n\n.g-muted   { color: var(--font-2nd); }\n.g-label-c { color: var(--text-label); }\n\n/* Color utility helpers mirroring Quasar's text-* / bg-* pattern */\n.text-primary  { color: var(--primary); }\n.text-positive { color: var(--positive); }\n.text-negative { color: var(--negative); }\n.text-warning  { color: var(--warning); }\n.text-info     { color: var(--info); }\n\n.bg-primary    { background: var(--primary); color: #fff; }\n.bg-primary-tint{ background: var(--primary-005); color: var(--primary); }\n.bg-positive   { background: var(--positive); color: #fff; }\n.bg-negative   { background: var(--negative); color: #fff; }\n.bg-warning    { background: var(--warning); color: #fff; }\n.bg-info       { background: var(--info); color: #fff; }\n<\u002Fstyle>\n<style>/* fallback */\n@font-face {\n  font-family: 'Material Icons';\n  font-style: normal;\n  font-weight: 400;\n  src: url(\"10955ad1-5ef6-4ba5-8e67-06c9c3d2f170\") format('woff2');\n}\n/* fallback */\n@font-face {\n  font-family: 'Material Icons Outlined';\n  font-style: normal;\n  font-weight: 400;\n  src: url(\"7726aac8-6f87-4c23-88ca-0152dae5680b\") format('woff2');\n}\n\n.material-icons {\n  font-family: 'Material Icons';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n\n.material-icons-outlined {\n  font-family: 'Material Icons Outlined';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #ececf0; padding: 40px 20px 60px; }\n  .page-header {\n    max-width: 1200px; margin: 0 auto 24px; padding: 0 8px;\n  }\n  .page-title { font-size: 24px; font-weight: 700; color: #303030; margin: 0 0 6px; }\n  .page-sub { font-size: 14px; color: #777; }\n\n  .tabs {\n    max-width: 1200px; margin: 0 auto 18px; padding: 0 8px;\n    display: flex; gap: 6px; flex-wrap: wrap;\n  }\n  .tab {\n    padding: 10px 16px; border-radius: 9999px; cursor: pointer;\n    background: #fff; border: 1px solid #e9e9ee; color: #303030;\n    font-size: 13px; font-weight: 500; font-family: inherit;\n    transition: all .15s ease;\n  }\n  .tab.active { background: #ff4130; color: #fff; border-color: #ff4130; }\n  .tab:hover:not(.active) { background: #fff7f4; border-color: #ffd9d3; }\n\n  .email-shell {\n    max-width: 720px; margin: 0 auto;\n    background: #fff; border-radius: 12px; overflow: hidden;\n    box-shadow: 0 2px 14px rgba(0,0,0,.08);\n  }\n\n  /* mail-client meta strip */\n  .mail-meta {\n    padding: 16px 28px; border-bottom: 1px solid #f0f0f4; background: #fafafc;\n    display: grid; grid-template-columns: 80px 1fr; gap: 6px 14px;\n    font-size: 12px;\n  }\n  .mail-meta .label { color: #9292a2; font-weight: 500; }\n  .mail-meta .value { color: #303030; font-weight: 500; }\n  .mail-meta .subject { font-weight: 600; font-size: 14px; color: #303030; }\n\n  /* email content */\n  .email-body { padding: 0; }\n  .email-banner {\n    padding: 36px 32px; text-align: center; color: #fff;\n  }\n  .email-banner h1 {\n    font-size: 22px; font-weight: 600; margin: 14px 0 6px;\n    line-height: 1.3;\n  }\n  .email-banner p { font-size: 13px; opacity: .92; margin: 0; line-height: 1.5; }\n  .email-banner .icon-circle {\n    width: 64px; height: 64px; border-radius: 9999px;\n    background: rgba(255,255,255,.18);\n    display: inline-flex; align-items: center; justify-content: center;\n  }\n  .email-banner .icon-circle .material-icons { font-size: 32px; color: #fff; }\n\n  .email-banner.warn    { background: linear-gradient(135deg, #ff8f00 0%, #e67e00 100%); }\n  .email-banner.danger  { background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); }\n  .email-banner.success { background: linear-gradient(135deg, #1dbf73 0%, #11a061 100%); }\n  .email-banner.brand   { background: linear-gradient(135deg, #ff4130 0%, #c91d10 100%); }\n\n  .email-content { padding: 32px; color: #303030; font-size: 14px; line-height: 1.6; }\n  .email-content h2 {\n    font-size: 16px; font-weight: 600; margin: 28px 0 10px; color: #303030;\n  }\n  .email-content h2:first-child { margin-top: 0; }\n  .email-content p { margin: 0 0 14px; }\n  .email-content ul { margin: 8px 0 14px; padding-left: 20px; }\n  .email-content li { margin-bottom: 6px; }\n  .email-content strong { color: #303030; font-weight: 600; }\n  .email-content a.btn {\n    display: inline-block; padding: 12px 22px; background: #ff4130; color: #fff;\n    border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;\n    margin: 8px 0;\n  }\n  .email-content a.btn.success { background: #1dbf73; }\n  .email-content a.link { color: #ff4130; font-weight: 500; text-decoration: none; }\n\n  .ref-box {\n    padding: 14px 18px; background: #fafafc; border-radius: 10px;\n    border: 1px solid #e9e9ee; margin: 18px 0;\n    display: flex; justify-content: space-between; align-items: center;\n  }\n  .ref-box .lbl { font-size: 11px; color: #9292a2; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }\n  .ref-box .val { font-size: 14px; color: #303030; font-weight: 600; }\n\n  /* blocker list inside email */\n  .blocker-item {\n    padding: 14px 16px; background: #fafafc; border-radius: 10px;\n    border-left: 4px solid #d32f2f; margin-bottom: 10px;\n  }\n  .blocker-item .title {\n    font-size: 14px; font-weight: 600; color: #303030; margin-bottom: 4px;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .blocker-item .title .material-icons { font-size: 18px; color: #d32f2f; }\n  .blocker-item .meta { font-size: 12px; color: #777; line-height: 1.5; }\n  .blocker-item ul { margin: 6px 0 0; padding-left: 16px; }\n  .blocker-item li { font-size: 12px; color: #555; margin-bottom: 2px; }\n  .blocker-item .warning {\n    margin-top: 8px; padding: 8px 10px; background: #fff1f0; border-radius: 6px;\n    font-size: 12px; color: #5c1612; display: flex; gap: 6px; align-items: flex-start;\n  }\n  .blocker-item .warning .material-icons { font-size: 14px; color: #d32f2f; flex-shrink: 0; margin-top: 1px; }\n\n  .countdown {\n    padding: 18px 20px; background: linear-gradient(135deg, #fff7f4 0%, #fff1f0 100%);\n    border: 1px solid #ffd9d3; border-rad
